name: Monthly Savings Reminder Cron

# Vercel Hobbyプランのcronは信頼性が低く実際には発火しないことが確認できたため、
# GitHub Actionsから毎月20日9:00 JST（0:00 UTC）に /api/cron/monthly-savings-reminder を呼び出す。
on:
  schedule:
    - cron: "0 0 20 * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call monthly-savings-reminder endpoint
        run: |
          curl -fsS -X GET "https://travel-expense-record.vercel.app/api/cron/monthly-savings-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
