name: Reminder Cron

# Vercel Hobbyプランのcronは1日1回しか実行されないため、
# GitHub Actionsから5分おきに /api/cron/reminders を呼び出して
# 予約リマインダーの送信タイミングをチェックする。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -fsS -X GET "https://travel-expense-record.vercel.app/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
